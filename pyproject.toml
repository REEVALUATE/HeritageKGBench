[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heritagekgbench"
version = "1.0.0"
description = "HeritageKGBench: a CACAO/CIDOC-CRM benchmark for knowledge graph construction from cultural heritage texts, with evaluation harness"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Ruben Peeters" },
    { name = "Xuemin Duan" },
    { name = "Anastasia Dimou" },
]
keywords = ["knowledge-graph", "benchmark", "cultural-heritage", "CIDOC-CRM", "CACAO", "LLM", "evaluation"]
dependencies = [
    "rdflib>=7.0",
    "python-dateutil>=2.8",
    "nltk>=3.8",
]

[project.optional-dependencies]
# Needed only to re-run the baseline KGC pipelines (heritagekgbench run ...);
# evaluation of existing predictions needs the base dependencies only.
pipeline = [
    "google-adk>=1.1.1",
    "litellm>=1.70.2",
    "pyshacl>=0.30.1",
    "requests",
    "beautifulsoup4",
    "pandas",
    "lxml>=5.4.0",
]

[project.scripts]
heritagekgbench = "heritagekgbench.cli:main"

[tool.setuptools.packages.find]
include = ["heritagekgbench*"]
